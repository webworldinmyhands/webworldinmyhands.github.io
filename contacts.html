<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — FunPay Helper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #0a0a0a;
            perspective: 800px;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: transparent;
            padding: 48px 40px;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            will-change: transform;
        }

        h1 {
            font-size: 38px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            transform: translateZ(20px);
        }

        .sub {
            font-size: 18px;
            color: #aaaaaa;
            margin-bottom: 32px;
            border-left: 3px solid #38bdf8;
            padding-left: 20px;
            transform: translateZ(10px);
        }

        .contact-card {
            background: #111;
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            border-left: 4px solid #38bdf8;
            transform: translateZ(5px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .contact-card .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .contact-card .label {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-card .value {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-card .value .badge {
            background: #1a1a1a;
            color: #38bdf8;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid #38bdf8;
        }

        .contact-card .action-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .contact-card .action-btn:hover {
            background: #2a2a2a;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .contact-card .action-btn.primary {
            background: #38bdf8;
            border-color: #38bdf8;
            color: #0a0a0a;
            font-weight: 600;
        }

        .contact-card .action-btn.primary:hover {
            background: #4ac5ff;
            border-color: #4ac5ff;
        }

        .btn-back {
            display: inline-block;
            margin: 20px 0 10px;
            background: #38bdf8;
            border: none;
            color: #0a0a0a;
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
            transform: translateZ(5px);
        }

        .btn-back:hover {
            background: #4ac5ff;
            transform: translateZ(15px);
        }

        .footer {
            border-top: 1px solid #1a1a1a;
            padding-top: 24px;
            margin-top: 30px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }

        .footer a {
            color: #777;
            text-decoration: none;
            transition: 0.2s;
        }
        .footer a:hover {
            color: #38bdf8;
        }

        @media (max-width: 600px) {
            .container { padding: 28px 20px; }
            h1 { font-size: 28px; }
            .sub { font-size: 16px; padding-left: 14px; }
            .contact-card { flex-direction: column; align-items: stretch; text-align: center; }
            .contact-card .value { justify-content: center; }
            .contact-card .action-btn { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container" id="card">
        <h1>📬 Контакты</h1>
        <p class="sub">Свяжитесь со мной любым удобным способом</p>

        <!-- Discord -->
        <div class="contact-card">
            <div class="info">
                <div class="label">💬 Discord</div>
                <div class="value">
                    fornaropfeifer37
                    <span class="badge">нажмите для копирования</span>
                </div>
            </div>
            <button class="action-btn primary" id="copyDiscordBtn">📋 Скопировать</button>
        </div>

        <!-- Discord Server -->
        <div class="contact-card">
            <div class="info">
                <div class="label">🎮 Discord-сервер</div>
                <div class="value">
                    PanicClient
                    <span class="badge">присоединяйся</span>
                </div>
            </div>
            <a href="https://discord.gg/Staxgz5Mw" target="_blank" class="action-btn primary">🚀 Присоединиться</a>
        </div>

        <a href="index.html" class="btn-back">← Вернуться на главную</a>

        <div class="footer">
            © 2025 — FunPay Helper &middot; <a href="#">GitHub</a> &middot; <a href="#">Discord</a>
        </div>
    </div>

    <script>
        (function() {
            // Наклон
            const card = document.getElementById('card');
            if (card) {
                const rect = card.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                document.addEventListener('mousemove', (e) => {
                    const deltaX = (e.clientX - centerX) / rect.width;
                    const deltaY = (e.clientY - centerY) / rect.height;
                    card.style.transform = `rotateX(${-deltaY * 6}deg) rotateY(${deltaX * 6}deg)`;
                });

                document.addEventListener('mouseleave', () => {
                    card.style.transform = 'rotateX(0deg) rotateY(0deg)';
                });
            }

            // Копирование Discord
            const copyBtn = document.getElementById('copyDiscordBtn');
            const discordNick = 'fornaropfeifer37';

            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(discordNick).then(() => {
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = '✅ Скопировано!';
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 2000);
                }).catch(() => {
                    const textArea = document.createElement('textarea');
                    textArea.value = discordNick;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = '✅ Скопировано!';
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 2000);
                });
            });
        })();
    </script>
</body>
</html>
