<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить отзыв — FunPay Helper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #0a0a0a;
            perspective: 800px;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: transparent;
            padding: 48px 40px;
            transition: transform 0.08s ease-out;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            will-change: transform;
        }

        h1 {
            font-size: 38px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            transform: translateZ(20px);
        }

        .sub {
            font-size: 18px;
            color: #aaaaaa;
            margin-bottom: 32px;
            border-left: 3px solid #38bdf8;
            padding-left: 20px;
            transform: translateZ(10px);
        }

        .form-container {
            background: #111;
            border-radius: 12px;
            padding: 24px 20px;
            border: 1px solid #2a2a2a;
            transform: translateZ(5px);
        }

        .form-container iframe {
            width: 100%;
            height: 700px;
            border: none;
            border-radius: 12px;
            background: #0d0d0d;
        }

        .btn {
            display: inline-block;
            margin: 20px 10px 10px 0;
            background: #38bdf8;
            border: none;
            color: #0a0a0a;
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
            transform: translateZ(5px);
        }

        .btn:hover {
            background: #4ac5ff;
            transform: translateZ(15px);
        }

        .btn-secondary {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #2a2a2a;
            border-color: #38bdf8;
        }

        .footer {
            border-top: 1px solid #1a1a1a;
            padding-top: 24px;
            margin-top: 30px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }

        .footer a {
            color: #777;
            text-decoration: none;
            transition: 0.2s;
        }
        .footer a:hover {
            color: #38bdf8;
        }

        @media (max-width: 600px) {
            .container { padding: 28px 20px; }
            h1 { font-size: 28px; }
            .sub { font-size: 16px; padding-left: 14px; }
            .form-container iframe { height: 800px; }
        }
    </style>
</head>
<body>
    <div class="container" id="card">
        <h1>✍️ Оставить отзыв</h1>
        <p class="sub">Поделитесь своим мнением о FunPay Helper</p>

        <div class="form-container">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeVFJ7vO4DAgHWGM_DaRkn-dDAQx7V0u6Nv3xjj3uM-wKov9A/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">
                Загрузка формы...
            </iframe>
        </div>

        <a href="reviews.html" class="btn">← Все отзывы</a>
        <a href="index.html" class="btn btn-secondary">← На главную</a>

        <div class="footer">
            © 2025 — FunPay Helper &middot; <a href="#">GitHub</a> &middot; <a href="#">Discord</a>
        </div>
    </div>

    <script>
        // ===== НАКЛОН =====
        (function() {
            const card = document.getElementById('card');
            if (!card) return;

            let isMobile = false;
            if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                isMobile = true;
            }

            if (!isMobile) {
                const rect = card.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                document.addEventListener('mousemove', (e) => {
                    const deltaX = (e.clientX - centerX) / rect.width;
                    const deltaY = (e.clientY - centerY) / rect.height;
                    card.style.transform = `rotateX(${-deltaY * 5}deg) rotateY(${deltaX * 5}deg)`;
                });

                document.addEventListener('mouseleave', () => {
                    card.style.transform = 'rotateX(0deg) rotateY(0deg)';
                });
            }

            if (isMobile) {
                let smoothX = 0, smoothY = 0;
                const lerpFactor = 0.08;

                function handleOrientation(event) {
                    let beta = event.beta || 0;
                    let gamma = event.gamma || 0;
                    const maxAngle = 20;
                    const targetX = Math.max(-maxAngle, Math.min(maxAngle, beta * 0.35));
                    const targetY = Math.max(-maxAngle, Math.min(maxAngle, gamma * 0.5));
                    smoothX += (targetX - smoothX) * lerpFactor;
                    smoothY += (targetY - smoothY) * lerpFactor;
                    card.style.transform = `rotateX(${-smoothX}deg) rotateY(${smoothY}deg)`;
                }

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    document.addEventListener('click', () => {
                        DeviceOrientationEvent.requestPermission().then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        }).catch(console.error);
                    });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            }
        })();
    </script>
</body>
</html>
