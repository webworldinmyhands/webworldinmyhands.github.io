<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы — FunPay Helper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #0a0a0a;
            perspective: 800px;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: transparent;
            padding: 48px 40px;
            transition: transform 0.08s ease-out;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            will-change: transform;
        }

        h1 {
            font-size: 38px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            transform: translateZ(20px);
        }

        .sub {
            font-size: 18px;
            color: #aaaaaa;
            margin-bottom: 32px;
            border-left: 3px solid #38bdf8;
            padding-left: 20px;
            transform: translateZ(10px);
        }

        .review {
            background: #111;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 14px;
            border-left: 4px solid #38bdf8;
            transform: translateZ(5px);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reviewer-name {
            font-weight: 600;
            color: #d4d4ff;
        }

        .review-date {
            color: #666;
            font-size: 13px;
        }

        .stars {
            color: #ffd700;
            font-size: 18px;
            letter-spacing: 2px;
            margin: 6px 0 4px;
        }

        .review-text {
            color: #bbb;
            margin: 4px 0 0;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            margin: 20px 10px 10px 0;
            background: #38bdf8;
            border: none;
            color: #0a0a0a;
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
            transform: translateZ(5px);
        }

        .btn:hover {
            background: #4ac5ff;
            transform: translateZ(15px);
        }

        .btn-secondary {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #2a2a2a;
            border-color: #38bdf8;
        }

        .footer {
            border-top: 1px solid #1a1a1a;
            padding-top: 24px;
            margin-top: 30px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }

        .footer a {
            color: #777;
            text-decoration: none;
            transition: 0.2s;
        }
        .footer a:hover {
            color: #38bdf8;
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 30px;
            font-size: 16px;
        }

        .empty {
            text-align: center;
            color: #666;
            padding: 30px;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .container { padding: 28px 20px; }
            h1 { font-size: 28px; }
            .sub { font-size: 16px; padding-left: 14px; }
        }
    </style>
</head>
<body>
    <div class="container" id="card">
        <h1>⭐ Отзывы</h1>
        <p class="sub">Что говорят пользователи о FunPay Helper</p>

        <div id="reviewsContainer">
            <div class="loading">⏳ Загрузка отзывов...</div>
        </div>

        <div style="margin-top: 20px;">
            <a href="leave-review.html" class="btn">✍️ Оставить отзыв</a>
            <a href="index.html" class="btn btn-secondary">← На главную</a>
        </div>

        <div class="footer">
            © 2025 — FunPay Helper &middot; <a href="#">GitHub</a> &middot; <a href="#">Discord</a>
        </div>
    </div>

    <script>
        // ===== ССЫЛКА НА ТВОЮ GOOGLE ТАБЛИЦУ =====
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSCB5wBSJNEhGREiRZzGHoCKfQrs34LzqcWK-31p5WcZnk_AUYhfmjH77aVnl3GFt0TaQAcvgIxz8ls/pub?gid=1662011496&single=true&output=csv';

        async function loadReviews() {
            const container = document.getElementById('reviewsContainer');

            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();

                // Парсим CSV
                const rows = csvText.split('\n').filter(row => row.trim() !== '');
                if (rows.length < 2) {
                    container.innerHTML = '<div class="empty">📭 Пока нет отзывов. Будьте первым!</div>';
                    return;
                }

                // Первая строка — заголовки
                const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim());
                const nameIndex = headers.findIndex(h => h.toLowerCase().includes('имя') || h.toLowerCase().includes('name'));
                const ratingIndex = headers.findIndex(h => h.toLowerCase().includes('оценк') || h.toLowerCase().includes('rating'));
                const textIndex = headers.findIndex(h => h.toLowerCase().includes('текст') || h.toLowerCase().includes('text') || h.toLowerCase().includes('отзыв'));

                // Если не нашли — используем порядковые номера (0, 1, 2)
                const useDefault = nameIndex === -1 || ratingIndex === -1 || textIndex === -1;

                let reviewsHTML = '';

                // Проходим по строкам (начиная со второй)
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(',').map(c => c.replace(/"/g, '').trim());
                    if (cols.length < 3) continue;

                    const name = useDefault ? cols[0] : cols[nameIndex];
                    const rating = parseInt(useDefault ? cols[1] : cols[ratingIndex]) || 5;
                    const text = useDefault ? cols[2] : cols[textIndex];

                    const stars = '★'.repeat(Math.min(5, Math.max(0, rating))) + '☆'.repeat(Math.max(0, 5 - Math.min(5, Math.max(0, rating))));

                    reviewsHTML += `
                        <div class="review">
                            <div class="review-header">
                                <span class="reviewer-name">${escapeHtml(name) || 'Аноним'}</span>
                                <span class="review-date">${new Date().toLocaleDateString('ru-RU')}</span>
                            </div>
                            <div class="stars">${stars}</div>
                            <p class="review-text">${escapeHtml(text) || 'Без текста'}</p>
                        </div>
                    `;
                }

                if (reviewsHTML) {
                    container.innerHTML = reviewsHTML;
                } else {
                    container.innerHTML = '<div class="empty">📭 Пока нет отзывов. Будьте первым!</div>';
                }

            } catch (error) {
                console.error('Ошибка загрузки отзывов:', error);
                container.innerHTML = `
                    <div class="empty" style="color: #f85149;">
                        ❌ Не удалось загрузить отзывы. Попробуйте позже.
                        <br><small style="color:#666;">${error.message}</small>
                    </div>
                `;
            }
        }

        // Простая защита от XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== НАКЛОН =====
        (function() {
            const card = document.getElementById('card');
            if (!card) return;

            let isMobile = false;
            if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                isMobile = true;
            }

            if (!isMobile) {
                const rect = card.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                document.addEventListener('mousemove', (e) => {
                    const deltaX = (e.clientX - centerX) / rect.width;
                    const deltaY = (e.clientY - centerY) / rect.height;
                    card.style.transform = `rotateX(${-deltaY * 5}deg) rotateY(${deltaX * 5}deg)`;
                });

                document.addEventListener('mouseleave', () => {
                    card.style.transform = 'rotateX(0deg) rotateY(0deg)';
                });
            }

            if (isMobile) {
                let smoothX = 0, smoothY = 0;
                const lerpFactor = 0.08;

                function handleOrientation(event) {
                    let beta = event.beta || 0;
                    let gamma = event.gamma || 0;
                    const maxAngle = 20;
                    const targetX = Math.max(-maxAngle, Math.min(maxAngle, beta * 0.35));
                    const targetY = Math.max(-maxAngle, Math.min(maxAngle, gamma * 0.5));
                    smoothX += (targetX - smoothX) * lerpFactor;
                    smoothY += (targetY - smoothY) * lerpFactor;
                    card.style.transform = `rotateX(${-smoothX}deg) rotateY(${smoothY}deg)`;
                }

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    document.addEventListener('click', () => {
                        DeviceOrientationEvent.requestPermission().then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        }).catch(console.error);
                    });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            }
        })();

        // Загружаем отзывы при открытии страницы
        loadReviews();
    </script>
</body>
</html>
